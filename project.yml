name: Strand
# Build identity (team, bundle id, app group) and opt-in features come from xcconfig, not from this
# file: Config/Base.xcconfig holds the defaults and includes the untracked Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Base/development language. The in-source UI strings are authored in English (US);
  # the String Catalog (Strand/Resources/Localizable.xcstrings) carries this as the
  # source language and is where additional languages are added.
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "7.0.1"
    SWIFT_VERSION: "5.0"
    # Emit localizable strings so Xcode auto-extracts every LocalizedStringKey into the
    # String Catalog on build (the English (US) base entries).
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Build for both Apple Silicon and Intel so the release runs on every Mac.
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Release:
      # Distribution builds must produce a universal binary, not just the host arch.
      ONLY_ACTIVE_ARCH: NO
packages:
  WhoopProtocol:
    path: Packages/WhoopProtocol
  WhoopStore:
    path: Packages/WhoopStore
  StrandAnalytics:
    path: Packages/StrandAnalytics
  StrandImport:
    path: Packages/StrandImport
  StrandDesign:
    path: Packages/StrandDesign
  # Compresses the full-database `.noopbak` backup (single-entry deflate ZIP) in DataBackup.swift.
  # Already resolved transitively via StrandImport; linked directly so the app target can
  # `import ZIPFoundation`. Same exact version as StrandImport's, so SPM resolves one copy.
  # Supply-chain: pinned EXACT (not `from:`) so a clean resolve can't auto-pull a newer —
  # potentially compromised — upstream release. Bump deliberately, in lockstep with the
  # Packages/*/Package.swift exact constraints and the committed Package.resolved.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  Strand:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
      - path: Shared/WidgetSnapshot.swift
    preBuildScripts:
      - name: Check external data folder entitlements
        script: Tools/check-external-data-folder.sh
        # Always run: a changed setting in Config/Local.xcconfig is not a file input Xcode tracks.
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/Tools/check-external-data-folder.sh"
          - "$(SRCROOT)/$(NOOP_APP_ENTITLEMENTS)"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/external-data-folder.checked"
    info:
      path: Strand/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "179"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your Mac. Nothing leaves your device."
        NSLocationWhenInUseUsageDescription: "NOOP records your route during an outdoor workout to show distance, pace, and a map. The route stays on your device. Nothing leaves it."
        # Shared with the desktop widget (MacWidgets) via WidgetSnapshot.suiteName.
        AppGroupIdentifier: "$(MAC_APP_GROUP_ID)"
        # Opt-in external data folder (folder name under the real home). Empty = feature off.
        NOOPExternalDataFolder: "$(NOOP_EXTERNAL_DATA_FOLDER)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOOP_BUNDLE_ID)"
        PRODUCT_NAME: NOOP
        # Hand-maintained entitlements, deliberately not generated by XcodeGen: the default file has
        # no sandbox exception; Config/Local.xcconfig may point this at the external-data-folder variant.
        CODE_SIGN_ENTITLEMENTS: "$(NOOP_APP_ENTITLEMENTS)"
        # Pin the Swift module name so `@testable import Strand` resolves even though PRODUCT_NAME is
        # NOOP — the test target and shared sources refer to the app module as `Strand`.
        PRODUCT_MODULE_NAME: Strand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Hardened Runtime closes the DYLD_INSERT_LIBRARIES injection vector for the
        # distributed (ad-hoc) build. The app uses no JIT / unsigned-exec memory, so it's safe.
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: ZIPFoundation
      - target: NOOPMacWidgets
  # macOS desktop widget (WidgetKit). Reads the snapshot the app publishes into the App Group.
  NOOPMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacWidgets
        excludes:
          - "Info.plist"
          - "NOOPMacWidgets.entitlements"
      - path: Shared/WidgetSnapshot.swift
    info:
      path: MacWidgets/Info.plist
      properties:
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "179"
        AppGroupIdentifier: "$(MAC_APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MacWidgets/NOOPMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(MAC_APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOOP_BUNDLE_ID).widgets"
        PRODUCT_NAME: NOOPMacWidgets
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: StrandDesign
  StrandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - StrandTests
      # Widget views are compiled into the tests too so ScreenSnapshotQATests can render them offscreen.
      - path: MacWidgets
        excludes:
          - "Info.plist"
          - "NOOPMacWidgets.entitlements"
      - path: Shared/WidgetSnapshot.swift
    dependencies:
      - target: Strand
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandDesign
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(NOOP_BUNDLE_ID).tests"
        # Host the unit tests in the app so `@testable import Strand` links against the real app module.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NOOP.app/Contents/MacOS/NOOP"
        BUNDLE_LOADER: "$(TEST_HOST)"

# Explicit scheme so `xcodebuild -scheme Strand …` builds and tests the macOS app with StrandTests.
schemes:
  Strand:
    build:
      targets:
        Strand: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrandTests
